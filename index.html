<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escama & Colmillo | Herpetocultura de Selección</title>
  
  <!-- Tipografías de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado -->
  <header class="header">
    <div class="header-container">
      <div class="logo">
        <h2>ESCAMA & COLMILLO</h2>
        <span class="pimvs-tag">PIMVS-SEMARNAT-HERP-089-26</span>
      </div>
      <a href="https://wa.me/5215512345678" target="_blank" class="btn-wa">
        Atención Directa
      </a>
    </div>
  </header>

  <!-- Banner -->
  <section class="hero">
    <h1>Colección Privada & Disponibles</h1>
    <p>Crianza de selección genética en Boa imperator y Python regius. Envíos autorizados con nota de remisión.</p>
  </section>

<!-- Grilla del Catálogo Dinámico -->
  <main class="container">

    <!-- BARRA DE FILTROS Y ORDENAMIENTO -->
    <div class="filtros-bar">
      <div class="filtro-grupo">
        <label for="filtro-sexo">Sexo</label>
        <select id="filtro-sexo" class="filtro-select">
          <option value="todos">Todos</option>
          <option value="Macho">Macho</option>
          <option value="Hembra">Hembra</option>
        </select>
      </div>

      <div class="filtro-grupo">
        <label for="filtro-nacimiento">Año de Nacimiento</label>
        <select id="filtro-nacimiento" class="filtro-select">
          <option value="todos">Todos los años</option>
          <!-- Se poblará automáticamente con los años disponibles en Sheets -->
        </select>
      </div>

      <div class="filtro-grupo">
        <label for="filtro-precio">Rango de Precio</label>
        <select id="filtro-precio" class="filtro-select">
          <option value="todos">Todos los precios</option>
          <option value="menos-2999">Menos de $2,999 MXN</option>
          <option value="2999-10000">$2,999 - $10,000 MXN</option>
          <option value="mas-10000">Más de $10,000 MXN</option>
        </select>
      </div>

      <div class="filtro-grupo">
        <label for="orden-precio">Ordenar por Precio</label>
        <select id="orden-precio" class="filtro-select">
          <option value="predeterminado">Predeterminado</option>
          <option value="menor-mayor">De menor a mayor</option>
          <option value="mayor-menor">De mayor a menor</option>
        </select>
      </div>
    </div>

    <div id="catalogo-grid" class="catalogo-grid">
      <p class="cargando">Cargando ejemplares disponibles...</p>
    </div>
  </main>

  <!-- VÍNCULO ESENCIAL: Carga la lógica de Google Sheets -->
  <script src="app.js"></script>

</body>
</html>
